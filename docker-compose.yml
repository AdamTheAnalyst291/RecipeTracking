# Home kitchen stack: Mealie (recipes, meal plans, shopping list), Grocy
# (pantry stock and prices) and Actual Budget (money). Each is one container
# with its own SQLite data in a named volume.
# Settings come from .env (copy .env.example; `mealie setup` does this for you).
# Image versions are pinned on purpose: Dependabot opens a PR when a new
# release is out, you read the notes, merge, then run `mealie update`.

name: mealie-home

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.29.0
    container_name: mealie
    restart: always
    ports:
      - "${MEALIE_PORT:-9925}:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
    environment:
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-false}"
      PUID: 1000
      PGID: 1000
      TZ: "${TZ:-America/New_York}"
      BASE_URL: "${BASE_URL:-http://localhost:9925}"
      # Optional email (invites, password resets). Fill these in .env to enable.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Mealie}"
      SMTP_AUTH_STRATEGY: "${SMTP_AUTH_STRATEGY:-TLS}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"

  # Pantry: what's in the house and what it cost. First login admin / admin.
  grocy:
    image: ghcr.io/linuxserver/grocy:4.7.1
    container_name: grocy
    restart: always
    ports:
      - "${GROCY_PORT:-9283}:80"
    deploy:
      resources:
        limits:
          memory: 300M
    volumes:
      - grocy-data:/config
    environment:
      PUID: 1000
      PGID: 1000
      TZ: "${TZ:-America/New_York}"

  # Budget and bank transactions (bank sync comes from the bridge below).
  actual:
    image: actualbudget/actual-server:26.10.0
    container_name: actual
    restart: always
    ports:
      - "${ACTUAL_PORT:-5006}:5006"
    deploy:
      resources:
        limits:
          memory: 500M
    volumes:
      - actual-data:/data

  # Kitchen bridge, our own code in ./bridge. For now: daily Plaid bank sync
  # into Actual (ADR-22). Only this laptop can open it (127.0.0.1), because
  # its page connects bank accounts.
  bridge:
    build: ./bridge
    container_name: bridge
    restart: always
    depends_on:
      - actual
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-8787}:8787"
    deploy:
      resources:
        limits:
          memory: 400M
    volumes:
      - bridge-data:/data
    environment:
      TZ: "${TZ:-America/New_York}"
      BANK_SYNC_HOUR: "${BANK_SYNC_HOUR:-6}"
      PLAID_CLIENT_ID: "${PLAID_CLIENT_ID:-}"
      PLAID_SECRET: "${PLAID_SECRET:-}"
      PLAID_ENV: "${PLAID_ENV:-production}"
      PLAID_REDIRECT_URI: "${PLAID_REDIRECT_URI:-}"
      ACTUAL_SERVER_URL: http://actual:5006
      ACTUAL_PASSWORD: "${ACTUAL_PASSWORD:-}"
      ACTUAL_SYNC_ID: "${ACTUAL_SYNC_ID:-}"
      ACTUAL_BUDGET_PASSWORD: "${ACTUAL_BUDGET_PASSWORD:-}"

volumes:
  # Fixed names so the backup/restore commands can always find them.
  mealie-data:
    name: mealie-data
  grocy-data:
    name: grocy-data
  actual-data:
    name: actual-data
  bridge-data:
    name: bridge-data

name: Infrastructure

# Terraform checks for infra/ (Dev, Prod, the module and the bootstrap), the deploy and
# export scripts' tests (the export also for real against a throwaway SQL Server), and a
# Dev plan on pull requests. Prod is never planned here: its
# identity signs in only in the Deploy Prod workflow, after Adam approves. Applying Dev
# happens in the Deploy Dev workflow on merge to main, right before the apps deploy.
# The bootstrap is applied by hand (infra/README.md).
#
# The repository is public (ADR-30), so only jobs for branches in this repository sign
# in to Azure. Pull requests from forks get the checks only: they never run in the `dev`
# GitHub Environment, which is the only place the Dev deploy identity can be used.
on:
  pull_request:
    branches: [main]
    paths:
      - infra/**
      - packages/db/sql/**
      - .config/dotnet-tools.json
      - .github/workflows/infrastructure.yml
      - .github/workflows/backup-prod.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - packages/db/sql/**
      - .config/dotnet-tools.json
      - .github/workflows/infrastructure.yml
      - .github/workflows/backup-prod.yml

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: 1.17.2

jobs:
  check:
    name: Terraform format, validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive -diff infra

      - name: Validate every root
        run: |
          for dir in infra/bootstrap infra/environments/dev infra/environments/prod infra/modules/environment; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # Plan-only tests with mocked providers; they need no Azure sign-in.
      - run: terraform -chdir=infra/bootstrap test
      - run: terraform -chdir=infra/modules/environment test
      - run: terraform -chdir=infra/environments/prod test

      # The deploy and export scripts against fake az, curl and sqlpackage.
      - run: bash infra/scripts/tests/deploy-api.test.sh
      - run: bash infra/scripts/tests/export-database.test.sh

  export-test:
    name: Export and restore a test database
    runs-on: ubuntu-latest
    # The weekly Prod export (card S2), run for real with SqlPackage against a throwaway
    # SQL Server that lives only as long as this job, then restored and compared. Only blob
    # storage is faked. The password is a throwaway for this container. Signs in to nothing.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Kitchen_Test_1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Kitchen_Test_1!' -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      # SqlPackage, at the version pinned in .config/dotnet-tools.json (the one Backup Prod uses).
      - run: dotnet tool restore

      - name: Export, restore and compare
        env:
          KITCHEN_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Kitchen_Test_1!;TrustServerCertificate=true
          # The sqlcmd inside the SQL Server container, so the runner needs no SQL tools.
          SQLCMD: docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Kitchen_Test_1!
          SQLPACKAGE: dotnet tool run sqlpackage
        run: bash infra/scripts/tests/export-database.integration.sh

  plan-dev:
    name: Plan Dev
    needs: check
    # Same-repository pull requests only; see the note at the top. Dependabot's runs get
    # no OIDC token, so its pull requests are planned by the apply after merge instead.
    # No concurrency group: a pending plan in the apply's group would cancel a pending
    # apply. Terraform's state lock (-lock-timeout) keeps a plan and an apply apart.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_deploy_identity_object_id: ${{ vars.AZURE_PRINCIPAL_ID }}
      TF_VAR_auth_client_id: ${{ vars.KITCHEN_AUTH_CLIENT_ID }}
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - name: Check that Azure sign-in is set up
        working-directory: .
        env:
          STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          if [ -z "$ARM_CLIENT_ID" ] || [ -z "$TF_VAR_deploy_identity_object_id" ] || [ -z "$STATE_ACCOUNT" ]; then
            echo "::error::The dev GitHub Environment or the TF_STATE_* repository variables are missing. Run infra/bootstrap and configure-github.sh first (see infra/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -lockfile=readonly
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      # The plan goes to the job summary rather than a pull request comment, so this job
      # needs no write access to the repository.
      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -no-color -lock-timeout=5m 2>&1 | tee plan.txt
          {
            echo "### Terraform plan for Dev"
            echo
            grep -E '^(Plan:|No changes\.)' plan.txt || echo "See the job log."
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

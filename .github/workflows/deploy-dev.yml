name: Deploy Dev

# Every merge to main applies Dev's Terraform, builds the web app and API once, keeps
# that build as an artifact, and deploys it to Dev (ADR-25). A later Prod deploy can
# download the same artifact instead of rebuilding.
#
# Azure jobs sign in with OIDC as the Dev deploy identity, which trusts only this
# repository's `dev` GitHub Environment. No secret is stored in GitHub; the Static Web
# Apps deployment token is fetched at deploy time.
#
# On pull requests this is a dry run: it builds and packages both apps and checks the
# packages, but signs in to nothing. The repository is public (ADR-30), so nothing a
# pull request runs here, from a fork or not, gets Azure credentials.
on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - infra/environments/**
      - infra/modules/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .github/workflows/deploy-dev.yml
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - infra/environments/**
      - infra/modules/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .github/workflows/deploy-dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time. A deploy waiting behind a running one is replaced by a newer
  # merge, so Dev ends on the latest main. A pull request's dry run is replaced by its next push.
  group: ${{ github.event_name == 'pull_request' && format('deploy-dev-pr-{0}', github.event.pull_request.number) || 'deploy-dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: 1.17.2

jobs:
  build:
    name: Build once
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run build test --filter=@kitchen/web --filter=@kitchen/api

      # The API ships as a zip holding its compiled code and production dependencies only.
      # A flat node_modules (no symlinks) keeps the zip self-contained.
      - name: Package the API
        run: |
          pnpm --filter @kitchen/api deploy --prod --config.node-linker=hoisted build/api
          (cd build/api && zip -qr ../api.zip . -x "node_modules/.pnpm/*")

      # The web app is plain static files; each deploy writes its own config.json.
      - name: Collect the web app
        run: cp -r apps/web/dist build/web

      # Catches a broken package on the pull request instead of on Dev.
      - name: Check the packages
        run: |
          set -euo pipefail
          listing=$(unzip -Z1 build/api.zip)
          for f in host.json package.json dist/index.js node_modules/@azure/functions/package.json node_modules/@kitchen/shared/package.json; do
            grep -qxF "$f" <<< "$listing" || { echo "::error::api.zip has no $f"; exit 1; }
          done
          for f in index.html staticwebapp.config.json; do
            [ -f "build/web/$f" ] || { echo "::error::The web build has no $f"; exit 1; }
          done
          echo "Packages look complete: api.zip is $(du -h build/api.zip | cut -f1)"

      - id: artifact
        run: echo "name=kitchen-build-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            build/api.zip
            build/web
          if-no-files-found: error
          retention-days: 90

  apply:
    name: Apply Dev infrastructure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_deploy_identity_object_id: ${{ vars.AZURE_PRINCIPAL_ID }}
    outputs:
      static_web_app_name: ${{ steps.tf.outputs.static_web_app_name }}
      function_app_name: ${{ steps.tf.outputs.function_app_name }}
      web_url: ${{ steps.tf.outputs.web_url }}
      api_url: ${{ steps.tf.outputs.api_url }}
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - name: Check that Azure sign-in is set up
        working-directory: .
        env:
          STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          if [ -z "$ARM_CLIENT_ID" ] || [ -z "$TF_VAR_deploy_identity_object_id" ] || [ -z "$STATE_ACCOUNT" ]; then
            echo "::error::The dev GitHub Environment or the TF_STATE_* repository variables are missing. Run infra/bootstrap and configure-github.sh first (see infra/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -lockfile=readonly
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=5m tfplan

      # Names and addresses only; nothing here is secret.
      - name: Read the outputs
        id: tf
        run: |
          set -euo pipefail
          for name in static_web_app_name function_app_name web_url api_url; do
            echo "$name=$(terraform output -raw "$name")" >> "$GITHUB_OUTPUT"
          done
          terraform output -no-color >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Dev
    needs: [build, apply]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    env:
      RESOURCE_GROUP: rg-kitchen-dev
      SWA_NAME: ${{ needs.apply.outputs.static_web_app_name }}
      FUNCTION_APP: ${{ needs.apply.outputs.function_app_name }}
      WEB_URL: ${{ needs.apply.outputs.web_url }}
      API_URL: ${{ needs.apply.outputs.api_url }}
    steps:
      - name: Check the Terraform outputs arrived
        run: |
          for v in SWA_NAME FUNCTION_APP WEB_URL API_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty; check the Apply job's outputs"; exit 1; }
          done

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: build

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az functionapp deploy` and `config-zip` don't work for Flex Consumption (Setlist
      # found the first gets HTTP 415 and the second fails its host-key health check), so
      # post the zip to the publish endpoint directly (it must be application/zip), then
      # wait for the deployment to finish.
      - name: Deploy the API
        run: |
          set -euo pipefail
          scm="https://$FUNCTION_APP.scm.azurewebsites.net"
          token=$(az account get-access-token --query accessToken -o tsv)
          echo "::add-mask::$token"
          headers=$(curl -sS -f -D - -o /dev/null -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/zip" \
            --data-binary @build/api.zip "$scm/api/publish?type=zip")
          location=$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="location" {print $2}')
          [ -n "$location" ] || { echo "::error::The publish endpoint returned no deployment to follow"; exit 1; }
          for attempt in $(seq 1 36); do
            status=$(curl -sS -f -H "Authorization: Bearer $token" "$location" | jq -r '.status')
            echo "Deployment status: $status (attempt $attempt)"
            case "$status" in
              4) exit 0 ;;                              # succeeded
              3) echo "::error::The API deployment failed"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The API deployment did not finish in time"; exit 1

      - name: Deploy the web app
        run: |
          set -euo pipefail
          jq -n --arg apiUrl "$API_URL" '{apiUrl: $apiUrl}' > build/web/config.json
          token=$(az staticwebapp secrets list -g "$RESOURCE_GROUP" -n "$SWA_NAME" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          SWA_CLI_DEPLOYMENT_TOKEN="$token" npx --yes @azure/static-web-apps-cli@2.1.0 deploy build/web --env production

      - name: Check that Dev works
        run: |
          set -uo pipefail
          wait_for() { # wait_for <url> <text>: retry while the new version starts up
            for attempt in $(seq 1 24); do
              body=$(curl -fsS --max-time 20 "$1" || true)
              if grep -qF -- "$2" <<< "$body"; then echo "OK: $1"; return 0; fi
              echo "Waiting for $1 (attempt $attempt)"; sleep 10
            done
            echo "::error::$1 did not return the expected content"; return 1
          }
          wait_for "$API_URL/api/health" '"status":"ok"' || exit 1
          wait_for "$WEB_URL/config.json" "$API_URL" || exit 1
          wait_for "$WEB_URL/" 'id="root"' || exit 1
          cors=$(curl -sSI -H "Origin: $WEB_URL" "$API_URL/api/health" | tr -d '\r' | grep -i '^access-control-allow-origin' || true)
          echo "CORS header: ${cors:-none}"
          [ -n "$cors" ] || { echo "::error::The API does not allow the web app's origin"; exit 1; }
          {
            echo "### Dev is up"
            echo "- Web app: $WEB_URL"
            echo "- API: $API_URL/api/health"
          } >> "$GITHUB_STEP_SUMMARY"

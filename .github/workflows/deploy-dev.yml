name: Deploy Dev

# Every merge to main applies Dev's Terraform, builds the web app and API once, keeps
# that build as an artifact, and deploys it to Dev (ADR-25). Deploy Prod builds the
# same commit with the same steps (.github/actions/build-kitchen) and deploys it with
# the same scripts (infra/scripts).
#
# Azure jobs sign in with OIDC as the Dev deploy identity, which trusts only this
# repository's `dev` GitHub Environment. No secret is stored in GitHub; the Static Web
# Apps deployment token is fetched at deploy time.
#
# On pull requests this is a dry run: it builds and packages both apps and checks the
# packages, but signs in to nothing. The repository is public (ADR-30), so nothing a
# pull request runs here, from a fork or not, gets Azure credentials.
on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - infra/environments/**
      - infra/modules/**
      - infra/scripts/**
      - .github/actions/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .github/workflows/deploy-dev.yml
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - infra/environments/**
      - infra/modules/**
      - infra/scripts/**
      - .github/actions/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .github/workflows/deploy-dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time. A deploy waiting behind a running one is replaced by a newer
  # merge, so Dev ends on the latest main. A pull request's dry run is replaced by its next push.
  group: ${{ github.event_name == 'pull_request' && format('deploy-dev-pr-{0}', github.event.pull_request.number) || 'deploy-dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: 1.17.2

jobs:
  build:
    name: Build once
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      # Build, test, package and check both apps (shared with Deploy Prod).
      - uses: ./.github/actions/build-kitchen

      - id: artifact
        run: echo "name=kitchen-build-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            build/api.zip
            build/web
          if-no-files-found: error
          retention-days: 90

  apply:
    name: Apply Dev infrastructure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_deploy_identity_object_id: ${{ vars.AZURE_PRINCIPAL_ID }}
      # The kitchen-dev app registration (infra/README.md, "Sign-in"). Empty until it exists.
      TF_VAR_auth_client_id: ${{ vars.KITCHEN_AUTH_CLIENT_ID }}
    outputs:
      static_web_app_name: ${{ steps.tf.outputs.static_web_app_name }}
      function_app_name: ${{ steps.tf.outputs.function_app_name }}
      web_url: ${{ steps.tf.outputs.web_url }}
      api_url: ${{ steps.tf.outputs.api_url }}
      auth_client_id: ${{ steps.tf.outputs.auth_client_id }}
      tenant_id: ${{ steps.tf.outputs.tenant_id }}
      sql_server_fqdn: ${{ steps.tf.outputs.sql_server_fqdn }}
      app_database_name: ${{ steps.tf.outputs.app_database_name }}
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - name: Check that Azure sign-in is set up
        working-directory: .
        env:
          STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          if [ -z "$ARM_CLIENT_ID" ] || [ -z "$TF_VAR_deploy_identity_object_id" ] || [ -z "$STATE_ACCOUNT" ]; then
            echo "::error::The dev GitHub Environment or the TF_STATE_* repository variables are missing. Run infra/bootstrap and configure-github.sh first (see infra/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -lockfile=readonly
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=5m tfplan

      # Names and addresses only; nothing here is secret.
      - name: Read the outputs
        id: tf
        run: |
          set -euo pipefail
          for name in static_web_app_name function_app_name web_url api_url auth_client_id tenant_id sql_server_fqdn app_database_name; do
            echo "$name=$(terraform output -raw "$name")" >> "$GITHUB_OUTPUT"
          done
          terraform output -no-color >> "$GITHUB_STEP_SUMMARY"

  # Runs before the new API goes out, so the code never meets a database older than it
  # expects. The deploy identity is the SQL server's Entra admin; no password exists.
  # Migrations only ever add (ADR-25 card F6); packages/db checks them against an empty
  # SQL Server in the pull request workflow.
  migrate:
    name: Migrate the Dev database
    needs: apply
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    env:
      SQL_SERVER: ${{ needs.apply.outputs.sql_server_fqdn }}
      SQL_DATABASE: ${{ needs.apply.outputs.app_database_name }}
    steps:
      - name: Check the Terraform outputs arrived
        run: |
          for v in SQL_SERVER SQL_DATABASE; do
            [ -n "${!v}" ] || { echo "::error::$v is empty; check the Apply job's outputs"; exit 1; }
          done

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @kitchen/db...

      - run: pnpm --filter @kitchen/db build

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply the migrations
        run: pnpm --filter @kitchen/db migrate

  deploy:
    name: Deploy to Dev
    needs: [build, apply, migrate]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    env:
      RESOURCE_GROUP: rg-kitchen-dev
      SWA_NAME: ${{ needs.apply.outputs.static_web_app_name }}
      FUNCTION_APP: ${{ needs.apply.outputs.function_app_name }}
      WEB_URL: ${{ needs.apply.outputs.web_url }}
      API_URL: ${{ needs.apply.outputs.api_url }}
      AUTH_CLIENT_ID: ${{ needs.apply.outputs.auth_client_id }}
      TENANT_ID: ${{ needs.apply.outputs.tenant_id }}
    steps:
      - name: Check the Terraform outputs arrived
        run: |
          for v in SWA_NAME FUNCTION_APP WEB_URL API_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is empty; check the Apply job's outputs"; exit 1; }
          done

      # The deploy and check scripts, shared with Deploy Prod.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: infra/scripts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: build

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Posts the zip to the Flex Consumption publish endpoint, retrying while a new
      # app's endpoint refuses it, then waits for the deployment to finish.
      - name: Deploy the API
        env:
          API_ZIP: build/api.zip
        run: infra/scripts/deploy-api.sh

      - name: Deploy the web app
        env:
          WEB_DIR: build/web
        run: infra/scripts/deploy-web.sh

      - name: Check that Dev works
        env:
          ENV_LABEL: Dev
        run: infra/scripts/check-deploy.sh

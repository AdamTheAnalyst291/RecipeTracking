name: check

on:
  push:
  pull_request:

jobs:
  compose:
    name: Compose file is valid and Mealie starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use example settings
        run: cp .env.example .env
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Start Mealie
        run: docker compose up -d
      - name: Wait for Mealie to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9925/api/app/about; then echo; echo "Mealie is up"; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Back up and restore round trip
        run: |
          docker compose stop
          mkdir -p backup
          docker run --rm -v mealie-data:/data:ro -v "$PWD/backup:/backup" alpine tar czf /backup/test.tar.gz -C /data .
          test -s backup/test.tar.gz
          docker run --rm -v mealie-data:/data -v "$PWD/backup:/backup:ro" alpine sh -c "find /data -mindepth 1 -delete && tar xzf /backup/test.tar.gz -C /data"
          docker compose start
          for i in $(seq 1 60); do
            curl -fsS http://localhost:9925/api/app/about >/dev/null && echo "Up after restore" && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Clean up
        if: always()
        run: docker compose down -v

  powershell:
    name: PowerShell script passes linting
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and lint mealie.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\mealie.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path .\mealie.ps1 -Severity Error
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }
          Write-Host "mealie.ps1 OK"
      - name: Help command runs
        shell: cmd
        run: mealie.cmd help

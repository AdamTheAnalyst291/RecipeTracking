name: check

on:
  push:
  pull_request:

jobs:
  compose:
    name: Compose file is valid and all apps start
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v7
      - name: Use example settings
        run: cp .env.example .env
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Start Mealie, Grocy, Actual Budget and the bridge
        run: docker compose up -d --build
      - name: Wait for all four to answer
        run: |
          up() {
            curl -fsS -o /dev/null http://localhost:9925/api/app/about &&
            curl -fsSL -o /dev/null http://localhost:9283/ &&
            curl -fsS -o /dev/null http://localhost:5006/health &&
            curl -fsS -o /dev/null http://localhost:8787/health
          }
          for i in $(seq 1 60); do
            if up; then echo "All four are up"; exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Staples load into Grocy, and a second run changes nothing
        run: |
          jar=$(mktemp)
          curl -fsS -o /dev/null -b "$jar" -c "$jar" -d 'username=admin&password=admin' http://localhost:9283/login
          curl -fsSL -o /dev/null -b "$jar" -c "$jar" http://localhost:9283/manageapikeys/new
          export GROCY_API_KEY=$(curl -fsS -b "$jar" http://localhost:9283/manageapikeys | grep -oE '\b[a-f0-9]{48}\b' | head -1)
          test -n "$GROCY_API_KEY"
          pwsh -NoProfile -File mealie.ps1 staples grocy/staples.csv
          pwsh -NoProfile -File mealie.ps1 staples grocy/staples.csv | tee second-run.txt
          grep -q '^0 new staples' second-run.txt
          rows=$(($(grep -c . grocy/staples.csv) - 1))
          products=$(curl -fsS -H "GROCY-API-KEY: $GROCY_API_KEY" http://localhost:9283/api/objects/products | jq length)
          echo "$rows rows, $products products"
          test "$rows" -eq "$products"
      - name: Back up and restore round trip, each app
        run: |
          up() {
            curl -fsS -o /dev/null http://localhost:9925/api/app/about &&
            curl -fsSL -o /dev/null http://localhost:9283/ &&
            curl -fsS -o /dev/null http://localhost:5006/health &&
            curl -fsS -o /dev/null http://localhost:8787/health
          }
          docker compose stop
          mkdir -p backup
          for v in mealie-data grocy-data actual-data bridge-data; do
            docker run --rm -v "$v:/data:ro" -v "$PWD/backup:/backup" alpine tar czf "/backup/$v.tar.gz" -C /data .
            test -s "backup/$v.tar.gz"
            docker run --rm -v "$v:/data" -v "$PWD/backup:/backup:ro" alpine sh -c "find /data -mindepth 1 -delete && tar xzf /backup/$v.tar.gz -C /data"
          done
          docker compose start
          for i in $(seq 1 60); do
            if up; then echo "All four up after restore"; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Clean up
        if: always()
        run: docker compose down -v

  bridge:
    name: Bridge builds and its tests pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  powershell:
    name: PowerShell script passes linting
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse and lint mealie.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\legacy\mealie.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path .\legacy\mealie.ps1 -Severity Error
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }
          Write-Host "mealie.ps1 OK"
      - name: Help command runs
        shell: cmd
        run: legacy\mealie.cmd help
      - name: A .env left at the repo root moves into legacy
        shell: pwsh
        run: |
          Set-Content -Path .env -Value 'MEALIE_PORT=1234'
          legacy\mealie.cmd help | Out-Null
          if (Test-Path .env) { throw '.env was not moved' }
          if ((Get-Content legacy\.env) -ne 'MEALIE_PORT=1234') { throw 'legacy\.env has the wrong content' }

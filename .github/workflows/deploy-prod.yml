name: Deploy Prod

# Deploys a commit on main to Prod (ADR-25, card S1). It never runs on a push to a
# branch or on a pull request: start it by hand on main (Actions, Deploy Prod, Run
# workflow), or push a release tag `v*` on a commit that is already on main.
#
# Every Prod deploy waits for Adam's approval: the only job that signs in to Azure runs
# in the `prod` GitHub Environment, which has Adam as its required reviewer and allows
# main (and `v*` tags) only. The Prod deploy identity trusts that environment and
# nothing else, so no other workflow, branch or fork can sign in as it. Apply, migrate
# and deploy share that one job, so one approval covers the whole deploy; each job that
# names a protected environment would ask again.
#
# The repository is public (ADR-30). This workflow has no pull_request trigger, and
# only people with write access can start it or push tags. Pull requests get Prod's
# Terraform fmt, validate and tests in the Infrastructure workflow, never a plan.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # One Prod deploy at a time, and never cancel a running one: a half-finished apply or
  # migration should run to the end. (A newer run still replaces one that is waiting.)
  group: deploy-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: 1.17.2

jobs:
  build:
    name: Build once
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to check the commit is on main

      - name: Check that this commit is on main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main) ;;
            refs/tags/v*)
              git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
                || { echo "::error::Tag $REF is on a commit that isn't on main. Prod deploys main only."; exit 1; } ;;
            *) echo "::error::Prod deploys main only; this run is on $REF. Start it on main, or tag a commit on main."; exit 1 ;;
          esac
          echo "Deploying $(git rev-parse --short HEAD) from $REF"

      # Build, test, package and check both apps, exactly as Deploy Dev does.
      - uses: ./.github/actions/build-kitchen

      - id: artifact
        run: echo "name=kitchen-prod-build-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            build/api.zip
            build/web
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to Prod
    needs: build
    # Belt and braces: the build job already refused anything else, and the prod
    # environment's own branch rule allows only main and v* tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod # waits here for Adam's approval
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_deploy_identity_object_id: ${{ vars.AZURE_PRINCIPAL_ID }}
      # The kitchen-prod app registration (infra/README.md, "Prod"). Empty until it exists.
      TF_VAR_auth_client_id: ${{ vars.KITCHEN_AUTH_CLIENT_ID }}
      RESOURCE_GROUP: rg-kitchen-prod
    steps:
      - name: Check that Azure sign-in is set up
        env:
          STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          if [ -z "$ARM_CLIENT_ID" ] || [ -z "$TF_VAR_deploy_identity_object_id" ] || [ -z "$STATE_ACCOUNT" ]; then
            echo "::error::The prod GitHub Environment or the TF_STATE_* repository variables are missing. Run infra/bootstrap and configure-github.sh first (see infra/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      # --- Terraform ---------------------------------------------------------

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra/environments/prod
        run: >
          terraform init -lockfile=readonly
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: terraform plan
        working-directory: infra/environments/prod
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        working-directory: infra/environments/prod
        run: terraform apply -no-color -lock-timeout=5m tfplan

      # Names and addresses only; nothing here is secret.
      - name: Read the outputs
        working-directory: infra/environments/prod
        run: |
          set -euo pipefail
          for name in static_web_app_name function_app_name web_url api_url auth_client_id tenant_id sql_server_fqdn app_database_name; do
            value=$(terraform output -raw "$name")
            echo "$(tr '[:lower:]' '[:upper:]' <<< "$name")=$value" >> "$GITHUB_ENV"
          done
          terraform output -no-color >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Terraform outputs arrived
        run: |
          for v in STATIC_WEB_APP_NAME FUNCTION_APP_NAME WEB_URL API_URL SQL_SERVER_FQDN APP_DATABASE_NAME; do
            [ -n "${!v}" ] || { echo "::error::$v is empty; check terraform output"; exit 1; }
          done

      # --- Migrate -----------------------------------------------------------
      # Before the new API goes out, so the code never meets a database older than it
      # expects. The Prod deploy identity is the SQL server's Entra admin; no password
      # exists. Migrations only ever add (card F6).

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @kitchen/db...

      - run: pnpm --filter @kitchen/db build

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply the migrations
        env:
          SQL_SERVER: ${{ env.SQL_SERVER_FQDN }}
          SQL_DATABASE: ${{ env.APP_DATABASE_NAME }}
        run: pnpm --filter @kitchen/db migrate

      # --- Deploy ------------------------------------------------------------

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: build

      # Retries the upload while a brand-new app's publish endpoint refuses it.
      - name: Deploy the API
        env:
          FUNCTION_APP: ${{ env.FUNCTION_APP_NAME }}
          API_ZIP: build/api.zip
        run: infra/scripts/deploy-api.sh

      - name: Deploy the web app
        env:
          SWA_NAME: ${{ env.STATIC_WEB_APP_NAME }}
          WEB_DIR: build/web
        run: infra/scripts/deploy-web.sh

      - name: Check that Prod works
        env:
          ENV_LABEL: Prod
        run: infra/scripts/check-deploy.sh

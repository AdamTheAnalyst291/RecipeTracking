# Opens a pull request when a new app image, bridge package or GitHub Action version is out.
version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/legacy"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "mealie"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      kitchen:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "terraform"
    directory: "/infra/bootstrap"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/legacy/bridge"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "bridge"
  - package-ecosystem: "docker"
    directory: "/legacy/bridge"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "bridge"

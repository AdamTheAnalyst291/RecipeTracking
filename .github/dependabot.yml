# Opens a pull request when a new app image, bridge package or GitHub Action version is out.
version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/legacy"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "mealie"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      kitchen:
        patterns: ["*"]
    ignore:
      # TypeScript 7 breaks typescript-eslint (PR #26); take majors by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "terraform"
    directories:
      - "/infra/bootstrap"
      - "/infra/modules/environment"
      - "/infra/environments/dev"
      - "/infra/environments/prod"
    schedule:
      interval: "monthly"
    # One PR for every Terraform folder, so a provider bump never lands in some of them only
    # (azurerm 5.14 split across #30, #32 and #33 broke terraform init on main).
    groups:
      terraform:
        patterns: ["*"]
    # Provider majors change live resources: take them as a planned card, not a bump.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "azure/azapi"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/legacy/bridge"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "bridge"
    # The bridge retires at switch-over (S3): patches and minors only (plaid 51 broke it, PR #23).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/legacy/bridge"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "bridge"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

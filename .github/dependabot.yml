# Opens a pull request when a new Mealie image or GitHub Action version is out.
version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "mealie"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

# Opens a pull request when a new app image, bridge package or GitHub Action version is out.
version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "mealie"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/bridge"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "bridge"
  - package-ecosystem: "docker"
    directory: "/bridge"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "bridge"
